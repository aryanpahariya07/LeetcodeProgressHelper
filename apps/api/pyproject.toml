[project]
name = "dsa-coach-api"
version = "0.1.0"
description = "DSA Coach API — adaptive DSA interview preparation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
    "fsrs>=6.3.2",
    # The default runtime coach (spec §2). Authenticates with a ChatGPT account,
    # so there is no API key to configure for a local single-user install.
    "openai-codex>=0.147.0",
    # The alternative runtime, selected by `coach_runtime=openai`.
    "openai-agents>=0.22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
dsa-coach = "dsa_coach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsa_coach"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["A003"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501", "I001"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["dsa_coach"]
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
